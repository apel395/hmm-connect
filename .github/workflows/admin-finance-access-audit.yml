name: Admin Finance Access Audit
on:
  push:
    branches: [feature/admin-finance-access-backend]
  pull_request:
    branches: [backend]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject raw finance role gates
        run: |
          if grep -RniE 'if not \{[^}]*\.name for .* in user\.roles\}\.intersection\(\{"FINANCE"' app/api/v1 --include='*.py'; then
            echo 'Raw FINANCE role gate found; use has_any_role instead.'
            exit 1
          fi
      - run: python -m compileall -q app
      - run: python scripts/validate_migration_chain.py
      - run: python scripts/validate_lambda_dependencies.py
