name: Validate Receiving Cost and Print Template

on:
  push:
    branches:
      - feature/receiving-cost-print-template

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
