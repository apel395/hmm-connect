name: Validate Finance Stabilization Backend
on:
  push:
    branches:
      - feature/finance-stabilization-backend
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q app
      - run: python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path('app/api/v1/payment_eligibility.py'),
              Path('app/api/v1/fiscal_periods.py'),
              Path('app/services/fiscal_period_service.py'),
          ]:
              ast.parse(path.read_text())
          print('backend syntax validation passed')
          PY
