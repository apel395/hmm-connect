name: Print Preview Check
on:
  push:
    branches: [feature/print-preview-dialog]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject remaining new-tab document print flows
        run: |
          if grep -Rni 'window.open' src --include='*.tsx' --include='*.ts' | grep -Ei '/print|print'; then
            echo 'New-tab document print action remains.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
