name: Validate Combined Receiving P2P Frontend
on:
  push:
    branches:
      - release/receiving-p2p-frontend
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
