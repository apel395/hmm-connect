name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/test-store-request-availability.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:finance
      - run: npm run test:store-request
      - run: npm run build
