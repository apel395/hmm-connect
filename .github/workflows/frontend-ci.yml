name: Frontend CI

on:
  pull_request:
    branches: [main, feature/hotel-pos-outlets-1024-ui]
    paths:
      - "src/**"
      - "scripts/test-store-request-availability.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:finance
      - run: npm run test:pos-operations
      - run: npm run test:store-request
      - run: npm run build

  purchasing-pdf-browser:
    name: Purchasing PDF browser check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/test-purchasing-pdf-browser.mjs
