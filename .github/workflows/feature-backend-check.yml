name: Feature Backend Check

on:
  push:
    branches:
      - feature/finance-flow-v2-backend
  pull_request:
    branches:
      - backend
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile backend
        run: python -m compileall -q app
      - name: Validate migration chain
        run: python scripts/validate_migration_chain.py
