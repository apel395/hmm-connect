name: Deploy backend to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches: [backend]
    paths:
      - "app/**"
      - "alembic/versions/**"
      - "scripts/validate_migration_chain.py"
      - "scripts/validate_lambda_dependencies.py"
      - "lambda_handler.py"
      - "requirements-api.txt"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: hmm-connect-lambda-production
  cancel-in-progress: false

jobs:
  package-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Validate migration chain
        run: python scripts/validate_migration_chain.py

      - name: Validate Lambda dependencies
        run: |
          set -euo pipefail
          python scripts/validate_lambda_dependencies.py
          if grep -Eiq '^(openpyxl|pandas|xlsxwriter|xlrd|xlwt|pyarrow|polars|numpy)([<=> ]|$)' requirements-api.txt; then
            echo "Worker-only dependencies must not be packaged in Lambda."
            exit 1
          fi

      - name: Validate async export deployment variables
        env:
          EXPORT_EC2_INSTANCE_ID: ${{ vars.EXPORT_EC2_INSTANCE_ID }}
          EXPORT_S3_BUCKET: ${{ vars.EXPORT_S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${EXPORT_EC2_INSTANCE_ID}" || { echo "Missing production variable EXPORT_EC2_INSTANCE_ID"; exit 1; }
          test -n "${EXPORT_S3_BUCKET}" || { echo "Missing production variable EXPORT_S3_BUCKET"; exit 1; }

      - name: Build Lambda ZIP
        run: |
          set -euo pipefail
          rm -rf build hmm-connect-lambda.zip
          mkdir -p build
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-api.txt --target build --only-binary=:all:
          cp -R app build/app
          cp lambda_handler.py build/lambda_handler.py
          rm -f build/app/api/v1/budgets.py build/app/api/v1/fixed_assets.py
          rm -f build/app/scripts/create_historical_import_samples.py
          rm -f build/app/scripts/export_worker.py
          rm -f build/app/scripts/journal_import_worker.py
          rm -f build/app/services/historical_import_service.py
          if find build -type f -name '*.py' -print0 | xargs -0 grep -Eiq '(^|[[:space:]])(from|import)[[:space:]]+(openpyxl|pandas|xlsxwriter|xlrd|xlwt|pyarrow|polars|numpy)(\.|[[:space:]]|$)'; then
            echo "Worker-only spreadsheet/dataframe imports found in Lambda build."
            exit 1
          fi
          test -f build/app/api/v1/trial_balance.py
          find build -type d -name '__pycache__' -prune -exec rm -rf {} +
          find build -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          SIZE_MB=$(du -sm build | cut -f1)
          echo "Uncompressed package size: ${SIZE_MB} MB"
          test "${SIZE_MB}" -le 200
          cd build && zip -qr ../hmm-connect-lambda.zip .

      - name: Validate packaged application
        env:
          SECRET_KEY: ci-only-secret-key-that-is-longer-than-32-characters
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci_db
          CORS_ORIGINS: http://localhost:5173
        run: |
          set -euo pipefail
          python -m compileall -q build/app build/lambda_handler.py
          (
            cd build
            PYTHONPATH=. python -c "from lambda_handler import handler; from app.main import app; assert handler is not None; assert app.title"
          )

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload ZIP to Lambda
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" --zip-file fileb://hmm-connect-lambda.zip
          aws lambda wait function-updated-v2 --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}"

      - name: Verify deployed function
        run: |
          set -euo pipefail
          CONFIG=$(aws lambda get-function-configuration --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" --query '{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,Architectures:Architectures,CodeSize:CodeSize,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus,ExportInstance:Environment.Variables.EXPORT_EC2_INSTANCE_ID,ExportBucket:Environment.Variables.EXPORT_S3_BUCKET}' --output json)
          echo "$CONFIG"
          test "$(echo "$CONFIG" | jq -r '.Handler')" = "lambda_handler.handler"
          test "$(echo "$CONFIG" | jq -r '.State')" = "Active"
          test "$(echo "$CONFIG" | jq -r '.LastUpdateStatus')" = "Successful"
          test -n "$(echo "$CONFIG" | jq -r '.ExportInstance // empty')"
          test -n "$(echo "$CONFIG" | jq -r '.ExportBucket // empty')"

      - name: Smoke test health endpoint
        if: ${{ vars.AWS_LAMBDA_FUNCTION_URL != '' }}
        env:
          FUNCTION_URL: ${{ vars.AWS_LAMBDA_FUNCTION_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${FUNCTION_URL%/}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "${BASE_URL}/health"; then
              echo
              echo "Lambda health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt} failed; retrying in 10 seconds."
            sleep 10
          done
          echo "Lambda health check failed after 5 attempts."
          exit 1
