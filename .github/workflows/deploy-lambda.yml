name: Deploy backend to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - backend
    paths:
      - "app/**"
      - "lambda_handler.py"
      - "requirements-api.txt"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: hmm-connect-lambda-production
  cancel-in-progress: false

jobs:
  package-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Build Lambda ZIP
        run: |
          set -euo pipefail
          rm -rf build hmm-connect-lambda.zip
          mkdir -p build
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements-api.txt \
            --target build \
            --only-binary=:all:
          cp -R app build/app
          cp lambda_handler.py build/lambda_handler.py
          find build -type d -name '__pycache__' -prune -exec rm -rf {} +
          find build -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          SIZE_MB=$(du -sm build | cut -f1)
          echo "Uncompressed package size: ${SIZE_MB} MB"
          if [ "${SIZE_MB}" -gt 200 ]; then
            echo "Package exceeds the internal 200 MB safety limit."
            exit 1
          fi

          cd build
          zip -qr ../hmm-connect-lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload ZIP to Lambda
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://hmm-connect-lambda.zip
          aws lambda wait function-updated-v2 \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}"

      - name: Verify deployed function
        run: |
          aws lambda get-function-configuration \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,Architectures:Architectures,CodeSize:CodeSize,LastModified:LastModified,State:State,LastUpdateStatus:LastUpdateStatus}'
